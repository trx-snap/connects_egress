# Connects Egress LL-HLS Web Player - HTTP/3 (QUIC) Nginx Configuration
# Listens on UDP and TCP port 3053 with native HTTP/3, TLS 1.3, and CORS

pid /tmp/connects-webplayer-h3.pid;
error_log /tmp/connects-webplayer-h3-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/connects-webplayer-h3-access.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream egress origin (connects-egress supervisor)
    upstream egress_origin {
        server 127.0.0.1:18080;
        keepalive 32;
    }

    server {
        # HTTP/3 over UDP
        listen 3053 quic reuseport;

        # HTTP/1.1 & HTTP/2 over TCP
        listen 3053 ssl;

        server_name localhost 127.0.0.1 192.168.0.136;

        # TLS Configuration for HTTP/3 (TLS 1.3 required for QUIC)
        ssl_certificate /Users/foxy/connects-egress/web-player/certs/cert.pem;
        ssl_certificate_key /Users/foxy/connects-egress/web-player/certs/key.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers off;
        ssl_early_data on;

        # QUIC optimizations
        quic_retry on;
        quic_gso on;

        # Advertise HTTP/3 via Alt-Svc header
        add_header Alt-Svc 'h3=":3053"; ma=86400' always;

        # Global CORS Headers for Web Player consumption
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Range, _HLS_msn, _HLS_part, _HLS_skip' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Content-Type, Age, Date, Server, Alt-Svc' always;

        # Root directory for static web player assets
        root /Users/foxy/connects-egress/web-player;
        index index.html;

        # Proxy LL-HLS Playlists (/live/...)
        location /live/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://egress_origin/live/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 30s;

            # Don't cache live playlists
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Alt-Svc 'h3=":3053"; ma=86400' always;
            add_header Access-Control-Allow-Origin '*' always;
        }

        # Proxy LL-HLS CMAF Media Parts and Inits (/media/...)
        location /media/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://egress_origin/media/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 30s;

            # Media parts are immutable
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Alt-Svc 'h3=":3053"; ma=86400' always;
            add_header Access-Control-Allow-Origin '*' always;
        }

        # Static assets (HTML, CSS, JS, Vendor)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Alt-Svc 'h3=":3053"; ma=86400' always;
            add_header Access-Control-Allow-Origin '*' always;
        }
    }
}
